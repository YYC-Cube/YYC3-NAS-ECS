# Docker Compose Override for Local Development
# This file automatically extends docker-compose.yml when running locally
# Run with: docker-compose up

version: '3.8'

services:
  # Frontend development server with hot reload
  frontend:
    volumes:
      # Mount source code for hot module replacement
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BUN_DEV_FLAG=--hot
    ports:
      - "3000:3000"
      - "3001:3001"  # HMR port

  # API development server
  api:
    volumes:
      # Mount source code for auto-reload
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DEBUG=true
      - LOG_LEVEL=debug
      - SQLALCHEMY_ECHO=true
    ports:
      - "5000:5000"  # Flask development server
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload

  # PostgreSQL with exposed port for local access
  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Mount initialization scripts
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis with exposed port for local access
  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # Grafana for development monitoring
  grafana:
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_dev_data:/var/lib/grafana

  # Prometheus for development monitoring
  prometheus:
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus

  # Mailhog for email testing (catches all emails)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - nas-network

  # Adminer for database management
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - nas-network

volumes:
  postgres_dev_data:
  grafana_dev_data:
  prometheus_dev_data:
