name: YYC3-NAS-ECS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ================== 代码质量检查 ==================
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行ESLint
        run: bun run lint --if-present

      - name: 运行Prettier检查
        run: bunx prettier --check "src/**/*.{ts,tsx,js,jsx}" --if-present

      - name: 运行类型检查
        run: bun run type-check --if-present

      - name: 检查TypeScript编译
        run: bun run tsc --noEmit --if-present

  # ================== 安全扫描 ==================
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行npm audit
        run: bunx audit --audit-level=moderate
        continue-on-error: true

      - name: 运行Snyk安全扫描
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: 上传Snyk结果到GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif

  # ================== 单元测试 ==================
  unit-test:
    name: 单元测试与覆盖率
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试并生成覆盖率
        run: bun run test:coverage

      - name: 上传覆盖率报告到Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 上传覆盖率报告到Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
          flag-name: unittests
        continue-on-error: true

      - name: 上传覆盖率报告作为Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ================== 集成测试 ==================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yyc3_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: bun install

      - name: 运行前端集成测试
        run: bun run test:integration --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yyc3_test
          REDIS_URL: redis://localhost:6379

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  # ================== E2E测试 ==================
  e2e-test:
    name: E2E测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 安装Playwright
        run: bunx playwright install --with-deps

      - name: 运行E2E测试
        run: bun run test:e2e --if-present

      - name: 上传测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ================== 构建前端 ==================
  build:
    name: 构建与部署
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, unit-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 构建前端
        run: bun run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      # ================== Docker构建 ==================
      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到Docker Hub
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: yyc3/nas-ecs
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================== 部署 ==================
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ${{ (github.ref == 'refs/heads/develop' && 'development') || 'production' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## 🚀 YYC3-NAS-ECS 新版本发布

            ### 📝 变更内容
            - 自动部署

            ### ✅ 测试
            - 所有测试通过

            ### 🔒 安全
            - 安全扫描通过
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 设置部署环境变量
      - name: 设置部署环境
        id: deploy_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "env=development" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.new.yml" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
          fi

      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets[format('{0}_HOST', steps.deploy_env.outputs.env)] }}
          username: ${{ secrets[format('{0}_USERNAME', steps.deploy_env.outputs.env)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.deploy_env.outputs.env)] }}
          script: |
            set -e

            # 部署目录
            cd /opt/yyc3-nas-ecs

            # 拉取最新代码
            echo "📥 Pulling latest code from ${{ github.ref_name }}..."
            git pull origin ${{ github.ref_name }}

            # 停止现有容器（如果运行）
            echo "🛑 Stopping existing containers..."
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} down || true

            # 拉取最新镜像
            echo "📦 Pulling latest Docker images..."
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} pull

            # 启动服务
            echo "🚀 Starting services..."
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} up -d

            # 等待服务启动
            echo "⏳ Waiting for services to be ready..."
            sleep 10

            # 健康检查 - 检查 API 端点
            echo "🏥 Running health checks..."
            MAX_RETRIES=30
            RETRY_COUNT=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:3000/api/v2/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Waiting for service to be ready... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 2
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts"
              echo "📋 Container logs:"
              docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} logs --tail=50 api
              exit 1
            fi

            # 运行数据库迁移
            echo "🗄️ Running database migrations..."
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} exec -T api python scripts/migrate.py upgrade || echo "⚠️  Migration failed or not configured"

            # 显示运行状态
            echo "📊 Service status:"
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} ps

      # 部署失败时的回滚
      - name: 部署失败回滚
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets[format('{0}_HOST', steps.deploy_env.outputs.env)] }}
          username: ${{ secrets[format('{0}_USERNAME', steps.deploy_env.outputs.env)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', steps.deploy_env.outputs.env)] }}
          script: |
            cd /opt/yyc3-nas-ecs

            # 回滚到上一个提交
            echo "🔄 Rolling back to previous version..."
            git reset --hard HEAD~1

            # 重新启动服务
            docker-compose -f ${{ steps.deploy_env.outputs.compose_file }} up -d

            echo "✅ Rollback completed"

  # ================== 通知 ==================
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 发送Slack通知
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 YYC3-NAS-ECS 部署完成

            **分支**: ${{ github.ref_name }}
            **提交**: ${{ github.sha }}
            **状态**: ${{ job.status }}
            **作者**: ${{ github.actor }}

            📊 [查看工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

      - name: 发送邮件通知
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: YYC3-NAS-ECS 部署通知 - ${{ job.status }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: YYC³ CI/CD
          body: |
            部署状态: ${{ job.status }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}
            作者: ${{ github.actor }}
        if: always()
