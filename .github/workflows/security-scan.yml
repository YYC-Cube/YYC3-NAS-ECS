name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # ================== 依赖漏洞扫描 ==================
  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      # 项目使用 bun.lock（无 package-lock.json），统一用 bun 审计
      - name: 运行依赖审计
        run: bun pm audit --audit-level=moderate || true

      - name: 运行 Snyk 扫描（可选，需配置 SNYK_TOKEN）
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json
        continue-on-error: true

      - name: 上传 Snyk 结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ================== 代码安全扫描 ==================
  code-scan:
    name: 代码安全扫描（CodeQL）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: security-extended, security-and-quality

      - name: 自动构建
        uses: github/codeql-action/autobuild@v3

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript,python"

  # ================== 容器安全扫描 ==================
  container-scan:
    name: 容器安全扫描
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 API 测试镜像
        run: docker build -t yyc3/nas-ecs:test ./api

      - name: 运行 Trivy 扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "yyc3/nas-ecs:test"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: 上传 Trivy 结果到 GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: 上传 Trivy 结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # 说明：
  # 1. 密钥泄露扫描由独立工作流 gitleaks.yml 负责（push/PR 全分支触发），此处不再重复。
  # 2. Semgrep v1 action 已废弃且与 CodeQL 职责重叠，已移除。
  # 3. 汇总报告 job 依赖各 job 的 artifact 文件，重构后按需重建。
