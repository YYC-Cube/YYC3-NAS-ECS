bindAddr = "0.0.0.0"
bindPort = 7001

auth.method = "token"
# 通过环境变量注入真实 token（frp Go template 展开），禁止将真实值写入本文件
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "yyc3"
# 通过环境变量注入真实密码，禁止将真实值写入本文件
webServer.password = "{{ .Envs.FRP_DASHBOARD_PASSWORD }}"

vhostHTTPPort = 18080
vhostHTTPSPort = 4443

transport.tls.certFile = "/etc/letsencrypt/live/0379.email/fullchain.pem"
transport.tls.keyFile = "/etc/letsencrypt/live/0379.email/privkey.pem"

allowPorts = [
  { start = 6000, end = 6009 },
  { start = 8080, end = 8080 }
]

subDomainHost = "0379.email"

log.to = "/root/frps/frps.log"
log.level = "warn"
